name: promocode-checker-local

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: promocode_checker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d promocode_checker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
