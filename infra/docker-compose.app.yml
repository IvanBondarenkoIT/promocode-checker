# Local full stack: Postgres (infra/docker-compose.yml) + app image with static UI.
# Usage from repo root:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.app.yml up --build

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${PUBLIC_HTTP_PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      APP_ENV: local
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      STATIC_DIR: /app/static
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/promocode_checker
      FRONTEND_BASE_URL: http://localhost:${PUBLIC_HTTP_PORT:-8000}
      ERP_ACCESS_MODE: mock
      AUTO_SEED_PROMOCODES: ${AUTO_SEED_PROMOCODES:-1}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
